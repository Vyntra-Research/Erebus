name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      node: ${{ steps.plan.outputs.node }}
      build: ${{ steps.plan.outputs.build }}
      rust: ${{ steps.plan.outputs.rust }}
      web_runtime: ${{ steps.plan.outputs.web_runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve changed areas
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          git diff --check "$base" "$HEAD_SHA"
          node scripts/ci-change-plan.mjs "$base" "$HEAD_SHA"

  quality:
    name: Quality
    needs: plan
    if: needs.plan.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check
        run: vp check

      - name: Typecheck workspace
        run: vpr typecheck

  smoke:
    name: Smoke
    needs: plan
    if: needs.plan.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Critical-path tests
        run: pnpm test:smoke

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build desktop pipeline
        run: vp run build:desktop

  native:
    name: Native
    needs: plan
    if: needs.plan.outputs.rust == 'true' || needs.plan.outputs.web_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/resource-monitor -> target
            native/computer-use -> target
            native/erebus-web -> target

      - name: Check resource monitor formatting
        if: needs.plan.outputs.rust == 'true'
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Test resource monitor
        if: needs.plan.outputs.rust == 'true'
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Check computer use formatting
        if: needs.plan.outputs.rust == 'true'
        run: cargo fmt --manifest-path native/computer-use/Cargo.toml -- --check

      - name: Check computer use
        if: needs.plan.outputs.rust == 'true'
        run: cargo check --locked --manifest-path native/computer-use/Cargo.toml

      - name: Lint computer use
        if: needs.plan.outputs.rust == 'true'
        run: cargo clippy --locked --all-targets --manifest-path native/computer-use/Cargo.toml -- -D warnings

      - name: Check web runtime formatting
        if: needs.plan.outputs.web_runtime == 'true'
        run: cargo fmt --manifest-path native/erebus-web/Cargo.toml -- --check

      - name: Test web runtime
        if: needs.plan.outputs.web_runtime == 'true'
        run: cargo test --locked --manifest-path native/erebus-web/Cargo.toml

      - name: Lint web runtime
        if: needs.plan.outputs.web_runtime == 'true'
        run: cargo clippy --locked --all-targets --manifest-path native/erebus-web/Cargo.toml -- -D warnings

      - name: Build web runtime
        if: needs.plan.outputs.web_runtime == 'true'
        run: cargo build --locked --release --manifest-path native/erebus-web/Cargo.toml

      - name: Setup Node
        if: needs.plan.outputs.web_runtime == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        if: needs.plan.outputs.web_runtime == 'true'
        run: corepack enable && corepack prepare pnpm@11.10.0 --activate

      - name: Install capture extension dependencies
        if: needs.plan.outputs.web_runtime == 'true'
        run: pnpm --dir native/erebus-web/extension install --frozen-lockfile

      - name: Check capture extension
        if: needs.plan.outputs.web_runtime == 'true'
        run: pnpm --dir native/erebus-web/extension run typecheck

      - name: Test capture extension
        if: needs.plan.outputs.web_runtime == 'true'
        run: pnpm --dir native/erebus-web/extension test

      - name: Build capture extension
        if: needs.plan.outputs.web_runtime == 'true'
        run: pnpm --dir native/erebus-web/extension build

  result:
    name: CI
    if: always()
    needs:
      - plan
      - quality
      - smoke
      - build
      - native
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: >-
            plan=${{ needs.plan.result }},
            quality=${{ needs.quality.result }},
            smoke=${{ needs.smoke.result }},
            build=${{ needs.build.result }},
            native=${{ needs.native.result }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "One or more selected CI jobs did not pass: $RESULTS" >&2
            exit 1
          fi
