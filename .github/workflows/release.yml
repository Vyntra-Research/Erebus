name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version without the v prefix"
        required: false
        type: string

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $requested = $env:DISPATCH_VERSION.Trim() -replace '^v', ''
          $version = if ($requested) {
            $requested
          } else {
            (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          "release=$($releaseExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Setup Vite+
        if: steps.existing.outputs.release != 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        if: steps.existing.outputs.release != 'true'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build unsigned Windows installer
        if: steps.existing.outputs.release != 'true'
        env:
          T3CODE_DESKTOP_VERSION: ${{ steps.version.outputs.value }}
          T3CODE_DESKTOP_OUTPUT_DIR: release
        run: vp run dist:desktop:win:x64

      - name: Upload workflow artifact
        if: steps.existing.outputs.release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: erebus-windows-x64-${{ steps.version.outputs.value }}
          path: release/*
          if-no-files-found: error

      - name: Create version tag and GitHub release
        if: steps.existing.outputs.release != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git rev-parse "refs/tags/$env:TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $env:TAG $env:TARGET_SHA -m "Release $env:TAG"
            git push origin $env:TAG
          }
          $releaseArgs = @(
            "release",
            "create",
            $env:TAG,
            "release/*",
            "--repo",
            $env:GITHUB_REPOSITORY,
            "--target",
            $env:TARGET_SHA,
            "--title",
            "Erebus $env:VERSION",
            "--generate-notes"
          )
          if ($env:VERSION.Contains("-")) {
            $releaseArgs += "--prerelease"
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
