[package]
name = "t3-resource-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# 0.39 requires Rust 1.95; Erebus currently builds with the Rust 1.94 toolchain.
sysinfo = "=0.38.4"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
